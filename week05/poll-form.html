<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Exercise</title>
</head>

<body>

    <header></header>

    <main>
        <form>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="useremail">Email:</label>
            <input type="email" name="useremail" id="useremail" required>

            <label for="browser">What is your favorite browser?</label>
            <select name="browser" id="browser">
                <option value="Firefox">Firefox</option>
                <option value="Chrome">Chrome</option>
                <option value="Edge">Edge</option>
                <option value="Brave">Brave</option>
                <option value="Opera-gx">Opera-gx</option>
                <option value="other">other</option>
            </select>

            <label for="petcheckbox">Do you have a household pet?</label>
            <input type="checkbox" name="pet" id="pet">

            <label for="feedback">List the places you have lived</label>
            <textarea name="feedback" id="feedback"
              placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>

            <button type="submit">Submit Poll</button>

        </form>
    </main>

    <footer></footer>
</body>

</html>
