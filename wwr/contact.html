<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Contact Us Page for the White Water Rafting Co.">
    <meta name="author" content="Dylan Henry">
    <title>Contact Us WhiteWater Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <!-- contains two items, a rafting site logo and a nav element with 4 children -->
        <img src="images/logo.jpg" alt="WhiteWater Rafting logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>

        </nav>
    </header>

    <main>
        <address class="contact">
            <p class="contact_name">White Water Rafting Co.</p>
            <p>
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+19999999999">+1 999 9999</a><br>
                <a href="info@whitewater.com">info@whitewater.com</a>
            </p>
        </address>

        <section class="split">
            <iframe class="map"
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2347.210706951761!2d73.37922713573899!3d18.457714095524857!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sus!4v1791063139517!5m2!1sen!2sus"
              allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
              title="Map of White Water Rafting Company">
            </iframe>

            <form class="form">
                <div class="field">
                    <label for="name">Name</label>
                    <input name="name" type="text" id="name" placeholder="Name" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="text" name="email" id="email" placeholder="Email" required>
                </div>

                <fieldset>
                    <legend>Message<br>Purpose</legend>
                    <div class="choices">
                        <label><input id="general_inquiry" type="radio" name="purpose"
                              value="general" checked> General
                            Inquiry</label>
                        <label><input id="reservation_question" type="radio" name="purpose"
                              value="reservation"> Reservation
                            Question</label>
                        <label><input id="website_suggestion" type="radio" name="purpose"
                              value="website"> Website
                            Suggestion</label>
                    </div>
                </fieldset>

                <div class="field field--stack">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="4" placeholder="Type here"
                      required></textarea>
                </div>

                <label class="check">
                    <input type="checkbox" name="newsletter" checked>
                    Please Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>

        </section>

        <section class="team">
            <h2 id="team-heading">We Are Here To Serve You!</h2>
            <ul>
                <li>
                    <img src="images/employees/employee1.jpg" alt="Geoffery">
                    <p>Employee Profile</p>
                </li>
                <li>
                    <img src="images/employees/employee2.jpg" alt="Anita">
                    <p>Employee Profile</p>
                </li>
                <li>
                    <img src="images/employees/employee3.jpg" alt="Wilfred">
                    <p>Employee Profile</p>
                </li>
            </ul>
        </section>

    </main>

    <footer>
        <p>© 2026 White Water Rafting Co. Dylan Henry</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook-bw.svg" alt="Facebook Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram-bw.svg" alt="Instagram Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin-bw.svg" alt="LinkedIn Icon">
            </a>

        </nav>
    </footer>
</body>

</html>
